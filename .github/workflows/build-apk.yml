name: Build Tablet Video Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Tablet Video Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Ensure Persistent Keystore for Consistent Updates
        run: |
          if [ ! -f app/videostudio.keystore ]; then
            keytool -genkeypair -v -keystore app/videostudio.keystore -alias videostudio -keyalg RSA -keysize 2048 -validity 10000 -storepass videostudiopass -keypass videostudiopass -dname "CN=TabletStudio, OU=VideoEditor, O=Android, L=BA, C=AR"
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TabletVideoStudio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabletVideoStudio-APK
          path: dist/TabletVideoStudio.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Tablet Video Studio v1.2.0"
          body: |
            ### 🎬 Tablet Video Studio v1.2.0
            - Botón directo en el visor para cargar Proyecto Demo de Venta con Efectos Especiales sin renderizar.
            - Pistas multipista de Video, PiP con bordes redondeados y sombra, Locución, SFX Whoosh/Pop/Ding, Música Lofi y Textos animados.
            - Totalmente interactivo en el reproductor interno.
          draft: false
          prerelease: false
          files: dist/TabletVideoStudio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

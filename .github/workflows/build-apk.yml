name: Build Tablet Video Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Tablet Video Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Ensure Persistent Keystore for Consistent Updates
        run: |
          if [ ! -f app/videostudio.keystore ]; then
            keytool -genkeypair -v -keystore app/videostudio.keystore -alias videostudio -keyalg RSA -keysize 2048 -validity 10000 -storepass videostudiopass -keypass videostudiopass -dname "CN=TabletStudio, OU=VideoEditor, O=Android, L=BA, C=AR"
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TabletVideoStudio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabletVideoStudio-APK
          path: dist/TabletVideoStudio.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Tablet Video Studio v1.0.0 (Android Autónomo)"
          body: |
            ### 🎬 Tablet Video Studio v1.0.0 — APK Autónomo para Android
            - **Sin dependencia de Termux:** Incluye toda la interfaz multipista de React Video Studio embebida y un servidor multimedia local + compositor Hardware `MediaCodec` (H.264 + AAC) integrado dentro del APK.
            - **Línea de tiempo multipista:** Videos, imágenes, superposiciones PiP, cortes (*Split*), recortes (*Trim*) y velocidad de reproducción.
            - **Capas de texto y audio:** Títulos con bordes/fondos redondeados, mezcla multipista de audio y grabación de voz en off.
            - **Integración nativa con Android:** Selector de archivos nativo de la Galería, guardado directo en `Movies/TabletVideoStudio` y `Download`, y botón de compartir a TikTok/WhatsApp/Reels.
          draft: false
          prerelease: false
          files: dist/TabletVideoStudio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
